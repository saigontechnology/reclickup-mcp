[project]
name = "reclickup-mcp"
version = "0.1.0"
description = "ClickUp MCP proxy (all official tools) + write ClickUp Docs with real table formatting: column widths, header colours, bold"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hao Nguyen", email = "hao.nguyen@saigontechnology.com" }]
requires-python = ">=3.9"
dependencies = [
  "websocket-client>=1.6",
  "cryptography>=41; sys_platform == 'darwin'",
]

[project.scripts]
reclickup-mcp = "reclickup_mcp.server:main"

[project.urls]
Homepage = "https://github.com/saigontechnology/reclickup-mcp"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reclickup_mcp"]
